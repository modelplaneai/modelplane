# The front door. It runs on the workload InferenceCluster, which also runs Envoy
# Gateway and Envoy AI Gateway for its own cluster gateway.
#
# Co-locating the InferenceGateway with the models it serves is a supported shape,
# and the one this test uses: the workload cluster hosts both gateways, each with
# its own LoadBalancer address from the MetalLB run.sh installs there.
#
# No TLS, so the gateway answers on its address over plain HTTP. It
# authenticates callers by API key, against the Secret below.
apiVersion: modelplane.ai/v1alpha1
kind: InferenceGateway
metadata:
  name: local
spec:
  clusterName: local
  auth:
    method: APIKey
    apiKey:
      secretSelector:
        matchLabels:
          modelplane.ai/inference-keys: "true"
---
# One caller, identified as e2e. run.sh sends its key in Authorization for
# OpenAI requests and in x-api-key for Anthropic ones.
apiVersion: v1
kind: Secret
metadata:
  name: e2e-callers
  namespace: modelplane-system
  labels:
    modelplane.ai/inference-keys: "true"
stringData:
  e2e: sk-e2e-caller
