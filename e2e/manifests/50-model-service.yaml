# One model as a caller sees it. There's no per-service address any more: a
# caller names this service as the request's model at any InferenceGateway
# serving it, which is every gateway here since none sets a serviceSelector.
# status.model is the name to pass (see README).
apiVersion: modelplane.ai/v1alpha1
kind: ModelService
metadata:
  name: mock
  namespace: ml-team
spec:
  endpoints:
  - selector:
      matchLabels:
        modelplane.ai/deployment: mock-demo
