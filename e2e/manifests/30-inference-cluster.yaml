# Registers the separate workload kind cluster via source: Existing. run.sh
# creates that cluster, builds the referenced kubeconfig Secret in
# modelplane-system (--internal address, reachable from the control plane's
# provider pods over the shared kind network), and labels its node
# modelplane.ai/pool=gpu-synthetic.
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: local
  labels:
    modelplane.ai/region: local
spec:
  cluster:
    source: Existing
    existing:
      secretRef:
        name: local-cluster-kubeconfig
        key: kubeconfig
  gateway:
    # An InferenceGateway addresses a cluster's gateway by name, never by
    # address, because Envoy AI Gateway only applies per-backend model
    # rewriting, credentials and priority failover when every backend in a
    # route is a hostname. In production you publish this name in DNS pointing
    # at status.gateway.address; run.sh adds a CoreDNS hosts entry for it on
    # the workload cluster instead, which is where the fleet gateway resolves
    # it from.
    hostname: local.clusters.modelplane.test
  nodePools:
  - name: gpu-synthetic
    className: synthetic-gpu
    nodeCount: 1
