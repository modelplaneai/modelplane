# Registers the separate workload kind cluster via source: Existing. run.sh
# creates that cluster, builds the referenced kubeconfig Secret in
# modelplane-system (--internal address, reachable from the control plane's
# provider pods over the shared kind network), and labels its node
# modelplane.ai/pool=gpu-synthetic.
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: local
  labels:
    modelplane.ai/region: local
spec:
  cluster:
    source: Existing
    existing:
      secretRef:
        name: local-cluster-kubeconfig
        key: kubeconfig
  # No gateway hostname: Modelplane derives the cluster gateway's internal name
  # and resolves it itself (compose-inference-gateway composes a Service for it
  # on the fleet gateway's cluster). A platform publishes no DNS per cluster.
  #
  # TODO(negz): the e2e harness (run.sh wire_cluster_gateway_dns and the
  # verify curls against local.clusters.modelplane.test) still assumes the old
  # published-DNS shape and needs reworking to the derived name. Unverified on
  # kind, where a headless Service to a MetalLB address may hairpin; the change
  # was validated on real EKS instead.
  nodePools:
  - name: gpu-synthetic
    className: synthetic-gpu
    nodeCount: 1
