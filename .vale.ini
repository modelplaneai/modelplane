# Vale lints the repo's prose. The docs get the full set of styles. Everything
# else in markdown, such as the skills and prompts agents load, the review
# agent's output and design docs, gets the ai-tells rules and a few Google ones.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Google, Microsoft, write-good, alex, proselint, https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

Vocab = Modelplane

[*.md]
BasedOnStyles = ai-tells

# Skip Hugo shortcodes, links, URLs and version numbers. These sit here rather
# than in the docs section because Vale 3.14 only applies them from a section
# like this one.
TokenIgnores = (\(#.*\)),(\]\(),(https?://[^\s)]+),(\!\[),(\d.*px),(\d\.\d\.\d),(\{\{<[^>]+>\}\})
BlockIgnores = (\{\{<\s*\/?.*>\}\}),(\{\{\<\/\*.*\*\/\>\}\})

# "Implementation" is the precise word in engineering prose, and the plainer
# alternatives this rule suggests are worse.
ai-tells.FormalRegister = NO

# Four rules from the Google style. The rest of it stays off, since it bans the
# first person that review comments and designs use.
Google.Anthropomorphism = error
Google.ExcessiveClaims = error
Google.Passive = error
Google.Semicolons = error

[docs/content/**/*.md]
# Undo the settings above that are for agents' prose, so the docs get the styles'
# own levels.
ai-tells.FormalRegister = error
Google.Anthropomorphism = suggestion
Google.ExcessiveClaims = suggestion
BasedOnStyles = Google, Microsoft, write-good, Modelplane, Vale, alex, proselint, ai-tells

Vale.Spelling = NO
write-good.Passive = NO
Microsoft.AMPM = NO
Microsoft.Auto = NO
Microsoft.Headings = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Gender = NO
Microsoft.GenderBias = NO
Microsoft.Ellipses = NO
Microsoft.DateFormat = NO
Microsoft.Dashes = NO
Microsoft.Spacing = NO
Microsoft.Acronyms = NO
Microsoft.Semicolon = NO
Microsoft.OxfordComma = NO
Microsoft.Hyphens = NO

Google.Latin = NO
Google.Contractions = NO

# Disabled for content reasons.
Google.We = NO
Google.Will = NO
Google.OxfordComma = NO
Microsoft.We = NO
Microsoft.FirstPerson = NO
Microsoft.Quotes = NO
Microsoft.GeneralURL = NO
Microsoft.Adverbs = NO
Microsoft.Contractions = NO
Microsoft.Passive = NO
Microsoft.SentenceLength = NO
write-good.E-Prime = NO
Google.Parens = NO
Google.Semicolons = NO
Google.Passive = NO
Microsoft.Vocab = NO
alex.Ablist = NO
alex.LGBTQ = NO
alex.OCD = NO
alex.Press = NO
alex.ProfanityLikely = NO
alex.ProfanityMaybe = NO
alex.ProfanityUnlikely = NO
alex.Suicide = NO

