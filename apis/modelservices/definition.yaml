apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: modelservices.modelplane.ai
spec:
  group: modelplane.ai
  names:
    categories: [crossplane, modelplane, models]
    kind: ModelService
    plural: modelservices
    shortNames: [ms]
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    additionalPrinterColumns:
    - name: MODEL
      type: string
      jsonPath: .status.model
    - name: READY
      type: string
      jsonPath: .status.conditions[?(@.type=='Ready')].status
    - name: AGE
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        description: >-
          A ModelService is one model as a caller sees it: a stable name that
          resolves to whichever ModelEndpoint should serve the next request. The
          endpoints behind it can be replicas Modelplane runs, models bought from
          a provider, or both, in more than one region.

          A caller reaches it by naming it as the model in an ordinary OpenAI or
          Anthropic request to any InferenceGateway that serves it. There is no
          per-service address.
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [endpoints]
            properties:
              endpoints:
                type: array
                description: >-
                  A priority order over ModelEndpoints, each entry selecting a
                  set of them by label. priority fails over: a tier is used only
                  once every tier above it has no healthy endpoint. weight splits
                  traffic within a tier, for canarying or biasing towards chosen
                  capacity.
                minItems: 1
                maxItems: 32
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [name]
                items:
                  type: object
                  required: [name, selector]
                  properties:
                    name:
                      type: string
                      description: >-
                        A stable name for this entry, unique within the service.
                        For example stable, canary, or a provider's name.
                      minLength: 1
                      maxLength: 63
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    priority:
                      type: integer
                      description: >-
                        Lower is preferred. Entries at the same priority share
                        traffic by weight; a higher-numbered entry is only tried
                        when no lower-numbered one has a healthy endpoint, which
                        is what makes a provider a failover for capacity you run.

                        A request that fails over is retried against the next
                        endpoint and gets that endpoint's own model name,
                        credential and path. Retrying is only possible until the
                        first byte reaches the caller, because after that the
                        tokens are already sent, so a backend that dies
                        mid-stream truncates the response instead.
                      format: int32
                      minimum: 0
                      maximum: 63
                      default: 0
                    weight:
                      type: integer
                      description: >-
                        Share of traffic for this entry relative to the other
                        entries at the same priority, spread as evenly as
                        possible across the endpoints it matches. A pair of
                        entries weighted 90 and 10 is a canary.

                        At least 1. A weight of 0 doesn't deprioritise a
                        backend, it drops it from the gateway's load assignment
                        entirely, which is indistinguishable from removing the
                        entry and easy to mistake for parking it. Remove the
                        entry instead.
                      format: int32
                      minimum: 1
                      maximum: 1000000
                      default: 1
                    selector:
                      type: object
                      description: >-
                        Selects ModelEndpoints in this ModelService's namespace.
                        Scope a service to a region by selecting only endpoints
                        in it; Modelplane stamps an InferenceCluster's labels
                        onto every endpoint composed there, so the region is
                        declared once on the cluster.
                      required: [matchLabels]
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                            maxLength: 63
                          minProperties: 1
                          maxProperties: 16
          status:
            type: object
            properties:
              model:
                type: string
                description: >-
                  The name a caller passes as the request's model. Namespaced, so
                  two services can't collide and the namespace serving a caller
                  is legible in what it passes.
              routes:
                type: object
                description: >-
                  Counts of the ModelRoutes this service composes, one per gateway
                  that serves it. ready is how many are carrying traffic; total is
                  how many gateways serve the service. total 0 means no gateway
                  serves it and no caller can reach it. Per-gateway detail,
                  including each gateway's address, is on the ModelRoutes
                  themselves: kubectl get modelroutes -l
                  modelplane.ai/service=<name>.
                properties:
                  total:
                    type: integer
                    format: int32
                    minimum: 0
                  ready:
                    type: integer
                    format: int32
                    minimum: 0
              conditions:
                type: array
                items:
                  type: object
