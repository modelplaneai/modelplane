[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crossplane-models"
version = "0.0.0"
requires-python = ">=3.11,<3.14"
# Every generated module imports pydantic. This went undeclared for a while and
# worked anyway, because each consumer also depended on the function SDK, which
# brings pydantic in. Anything depending on the models alone got an ImportError.
dependencies = ["pydantic>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["models"]
