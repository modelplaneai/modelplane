baseURL = "/"
languageCode = "en-us"
title = "Modelplane Docs"
theme = "geekboot"
enableRobotsTXT = true
enableGitInfo = true

# Term pages power the recipe catalog facets; taxonomy (index-of-terms) pages
# stay disabled — the catalog page on /recipes/ fills that role.
disableKinds = ["taxonomy"]
# Keep term titles exactly as written in front matter ("vLLM", not "VLLM").
capitalizeListTitles = false
ignoreFiles = ["themes/geekboot/content/.*", "README.md"]

# Only vendors and clouds are taxonomies — their term pages are the browse
# targets on /recipes/. GPU, engine, and technique facets are plain front
# matter rendered inline; they get no term pages until something links there.
[taxonomies]
  vendor = "vendors"
  cloud  = "clouds"

# Nest term pages under the Recipes section so facet URLs read as part of the
# catalog: /recipes/cloud/nebius/ lists every recipe that runs on Nebius.
[permalinks]
  [permalinks.term]
    vendors = "/recipes/vendor/:slug/"
    clouds  = "/recipes/cloud/:slug/"

[outputs]
  home = ["html", "llms", "llmsfull", "llmsjson"]
  section = ["html", "rss", "markdown"]
  page = ["html", "markdown"]
  term = ["html"]

# Machine-readable variants for AI agents and LLM tools. The markdown format
# emits a raw-Markdown sibling of every page (page/index.md); the home page also
# emits llms.txt (an index), llms-full.txt (every page concatenated), and
# llms.json (the corpus the docs MCP server searches). See content/ai-tools.md.
[outputFormats]
  [outputFormats.markdown]
    mediaType = "text/markdown"
    isPlainText = true
    isHTML = false
    permalinkable = true
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
  [outputFormats.llmsfull]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
  [outputFormats.llmsjson]
    mediaType = "application/json"
    baseName = "llms"
    isPlainText = true


[build]
  # Emit hugo_stats.json listing the tags, classes, and IDs the site uses.
  # PurgeCSS reads it to strip unused CSS rules. See postcss.config.js.
  [build.buildStats]
    enable = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 9
  [markup.highlight]
    codeFences = true
    noClasses = false
    linenos = false
    anchorLineNos = false
    lineNumbersInTable = false

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "assets/content"
    includeFiles = ["**/**.png", "**/**.jpg", "**/**.jpeg", "**/**.gif"]
  # Defining any data mount below suppresses Hugo's default data mount, so mount
  # the local data dir explicitly (holds apigroups.yaml, which groups the API
  # reference). Accessible as site.Data.apigroups.
  [[module.mounts]]
    source = "data"
    target = "data"
  # Mount the APIs directory as Hugo data so the reference partials can read
  # definition.yaml files without a separate generation step.
  # Accessible as site.Data.apis.crds.<plural>.definition
  [[module.mounts]]
    source = "../apis"
    target = "data/apis/crds"
  # Also mount it as assets so the Markdown output can emit the raw definition.yaml
  # verbatim (comments preserved) via resources.Get "apis/<plural>/definition.yaml".
  [[module.mounts]]
    source = "../apis"
    target = "assets/apis"
  # Mount the manifests directory as assets so the manifests shortcode can read
  # raw YAML (preserving comments) via resources.Get "examples/<path>.yaml". The
  # files live under docs/manifests/<section>/, one subtree per docs section.
  [[module.mounts]]
    source = "manifests"
    target = "assets/examples"

[security]
  [security.funcs]
    getenv = ["^CONTEXT", "^REVIEW_ID", "^VERCEL_ENV"]

[params]
  docs = true
  description = "Modelplane documentation."
  # "main" on the dev branch; "X.Y" (e.g. "0.1") on release branches.
  version = "0.2"
  # Latest stable release. Drives the version dropdown and the "not the latest
  # release" banners; the apex (docs.modelplane.ai) is this release's own build.
  latest = "0.3"
  [params.anchors]
    min = 2
    max = 5
