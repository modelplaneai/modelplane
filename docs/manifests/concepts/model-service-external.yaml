# A ModelService's endpoints list combines: one entry can select your own
# deployment's replicas while another selects an external ModelEndpoint, so a
# SaaS provider sits under the same model name as your own replicas. At the same
# priority the two split traffic by weight.
apiVersion: modelplane.ai/v1alpha1
kind: ModelService
metadata:
  name: kimi-k2
  namespace: ml-team
spec:
  endpoints:
  - name: kimi-k2
    selector:
      matchLabels:
        modelplane.ai/deployment: kimi-k2          # your own replicas
  - name: together
    selector:
      matchLabels:
        modelplane.ai/external-provider: together  # the endpoint above
