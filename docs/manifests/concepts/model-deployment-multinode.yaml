# A ModelDeployment serving one model across two nodes.
#
# When a model is too large to fit on one node's GPUs, make an engine a gang:
# give it a Leader and a Worker member, whose worker.nodes expands to that many
# worker pods, one per node. The scheduler picks a cluster with a pool that has
# enough GPUs per node and enough nodes for the whole gang.
#
# By default a cluster serves multi-node gangs with the Standard stack
# (InferenceCluster.spec.stack: Standard), so Modelplane
# composes the gang into a LeaderWorkerSet. On that backend Modelplane injects
# backend-neutral env vars into every gang pod, so the command is the same for
# the leader and the workers:
#   - $(MODELPLANE_LEADER_ADDRESS) is the address the leader is reachable at.
#   - $(MODELPLANE_RANK) is the pod's node rank: 0 on the leader, 1..N on the
#     workers. The worker also adds --headless.
#
# This example selects Standard through its default Unified picker. A Dynamo
# deployment sets serving.router: Dynamo, supplies serving.dynamo.frontend, and
# declares a native runtime init sidecar on the leader. On either stack the
# command/args aliases MODELPLANE_LEADER_ADDRESS and MODELPLANE_RANK resolve to
# that engine copy's leader address and absolute pod rank. See the Dynamo
# multi-node guide for the explicit native-gRPC sidecar launch contract.
#
# Multi-node engines require a ModelCache: every pod in the gang mounts it at
# /mnt/models, staged in HuggingFace's cache layout. Both members name the model
# by its repo id, exactly as they would without a cache - Modelplane points
# HuggingFace at the mount, so the repo id resolves to the pre-staged weights
# instead of being pulled.
#
# This shape (vLLM's native multiprocessing backend, TP within a node and PP
# across nodes) is the one validated serving Qwen3-Coder-480B; see
# examples/qwen3-coder/ for the full platform side.
apiVersion: modelplane.ai/v1alpha1
kind: ModelDeployment
metadata:
  name: qwen3-coder
  namespace: ml-team
spec:
  replicas: 1
  template:
    spec:
      modelCacheRef:
        name: qwen3-coder
      engines:
      - name: qwen3-coder
        members:
        - role: Leader
          nodeSelector:
            devices:
            - name: gpu
              count: 8
              selectors:
              - cel: |
                  device.capacity["gpu.nvidia.com"].memory.compareTo(quantity("120Gi")) >= 0
          template:
            spec:
              containers:
              - name: engine
                image: vllm/vllm-openai:v0.23.0
                command:
                - /bin/sh
                - -c
                - >-
                  exec vllm serve Qwen/Qwen3-Coder-480B-A35B-Instruct
                  --served-model-name=$(MODELPLANE_SERVED_MODEL_NAME)
                  --tensor-parallel-size=8
                  --pipeline-parallel-size=2
                  --distributed-executor-backend=mp
                  --nnodes=2 --node-rank=$(MODELPLANE_RANK)
                  --master-addr=$(MODELPLANE_LEADER_ADDRESS)
                  --max-model-len=32768
                  --port=8000
        - role: Worker
          worker:
            nodes: 1
          nodeSelector:
            devices:
            - name: gpu
              count: 8
              selectors:
              - cel: |
                  device.capacity["gpu.nvidia.com"].memory.compareTo(quantity("120Gi")) >= 0
          template:
            spec:
              containers:
              - name: engine
                image: vllm/vllm-openai:v0.23.0
                command:
                - /bin/sh
                - -c
                - >-
                  exec vllm serve Qwen/Qwen3-Coder-480B-A35B-Instruct
                  --served-model-name=$(MODELPLANE_SERVED_MODEL_NAME)
                  --tensor-parallel-size=8
                  --pipeline-parallel-size=2
                  --distributed-executor-backend=mp
                  --nnodes=2 --node-rank=$(MODELPLANE_RANK)
                  --master-addr=$(MODELPLANE_LEADER_ADDRESS)
                  --headless
                  --max-model-len=32768
