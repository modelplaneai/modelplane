apiVersion: modelplane.ai/v1alpha1
kind: ModelDeployment
metadata:
  name: qwen-demo
  namespace: ml-team
spec:
  replicas: 1
  template:
    spec:
      engines:
      - name: qwen
        members:
        - role: Standalone
          nodeSelector:
            devices:
            - name: gpu
              count: 1
              selectors:
              # The fake GPU declares 80Gi, so it satisfies >= 20Gi. The selector
              # matches against the capacity declared in the InferenceClass, not
              # the pod's resource requests.
              - cel: |
                  device.capacity["gpu.example.com"].memory.compareTo(quantity("20Gi")) >= 0
          template:
            spec:
              containers:
              - name: engine
                # llama.cpp serves the model on the CPU, so the fake GPU is
                # claimed but never used. Pinned by digest: the server tag
                # moves, and the digest covers amd64 and arm64.
                image: ghcr.io/ggml-org/llama.cpp:server@sha256:991cf50e9eb7dee4c18090849c7f909bafc5a1884cdde2dc3011df7407da09d6
                env:
                - name: LLAMA_ARG_HF_REPO
                  value: Qwen/Qwen2.5-0.5B-Instruct-GGUF   # about 400 MB at the default quantization
                # Answer to the name the gateway rewrites requests to.
                - name: LLAMA_ARG_ALIAS
                  value: $(MODELPLANE_SERVED_MODEL_NAME)
                # Modelplane routes to port 8000 on every interface; llama.cpp
                # defaults to 8080 on loopback.
                - name: LLAMA_ARG_HOST
                  value: 0.0.0.0
                - name: LLAMA_ARG_PORT
                  value: "8000"
                # The default is the model's full context, which needs more
                # memory than a laptop cluster has to spare.
                - name: LLAMA_ARG_CTX_SIZE
                  value: "4096"
