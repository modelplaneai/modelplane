apiVersion: modelplane.ai/v1alpha1
kind: InferenceClass
metadata:
  name: a16-1x
spec:
  # Vultr GPU plans are region-gated and the catalog changes; list what a
  # region offers with the /v2/regions/<region>/availability API before
  # picking another plan.
  description: "Vultr vcg-a16-6c-60g-16vram, 1x NVIDIA A16 16GB"
  provisioning:
    provider: Vultr
    vultr:
      plan: vcg-a16-6c-60g-16vram
      accelerator:
        type: nvidia-a16
        count: 1
  devices:
  - name: gpu
    claim: DRA
    driver: gpu.nvidia.com
    deviceClassName: gpu.nvidia.com
    count: 1
    attributes:
      architecture: { string: Ampere }
      cudaComputeCapability: { version: "8.6.0" }
    capacity:
      memory: { value: "16384Mi" }
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: vultr-ewr
  labels:
    modelplane.ai/region: ewr
spec:
  cluster:
    source: Vultr
    vultr:
      region: ewr
      # VKE accepts only the exact versions it currently offers; list them
      # with vultr-cli kubernetes versions.
      kubernetesVersion: "v1.36.6+1"
  nodePools:
  - name: gpu-a16
    className: a16-1x
    nodeCount: 1
    minNodeCount: 1
    maxNodeCount: 1
