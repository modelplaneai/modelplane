# Exposes the deployment as one model a caller can name.
# Name the model, ml-team/glm-air, in a request to an InferenceGateway
# that serves it.
apiVersion: modelplane.ai/v1alpha1
kind: ModelService
metadata:
  name: glm-air
  namespace: ml-team
spec:
  endpoints:
  - name: glm-air
    selector:
      matchLabels:
        modelplane.ai/deployment: glm-air
