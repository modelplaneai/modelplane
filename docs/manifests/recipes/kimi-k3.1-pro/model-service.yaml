# Name the model, ml-team/kimi-k3-1-pro, in an OpenAI or Anthropic request to
# an InferenceGateway that serves it, e.g.:
#   ADDR=$(kubectl get ig public -o jsonpath='{.status.endpoints.openAI}')
#   curl "$ADDR/chat/completions" -H 'Content-Type: application/json' \
#     -d '{"model":"ml-team/kimi-k3-1-pro","messages":[{"role":"user","content":"hello"}]}'
apiVersion: modelplane.ai/v1alpha1
kind: ModelService
metadata:
  name: kimi-k3-1-pro
  namespace: ml-team
spec:
  endpoints:
  - name: kimi-k3-1-pro
    selector:
      matchLabels:
        modelplane.ai/deployment: kimi-k3-1-pro
