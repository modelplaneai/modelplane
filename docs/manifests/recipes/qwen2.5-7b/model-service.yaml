# Exposes the deployment as one model a caller can name.
# Name the model, ml-team/qwen-7b, in a request to an InferenceGateway
# that serves it.
apiVersion: modelplane.ai/v1alpha1
kind: ModelService
metadata:
  name: qwen-7b
  namespace: ml-team
spec:
  endpoints:
  - name: qwen-7b
    selector:
      matchLabels:
        modelplane.ai/deployment: qwen-7b
