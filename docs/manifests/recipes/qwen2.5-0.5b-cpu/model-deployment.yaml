# A small model served on CPUs alone. The device selector matches against
# the claimable cores the civo-cpu-8vcpu class declares, so >= 4 lands it on
# the CPU pool; the claim takes the engine's CPU request, five cores, as
# capacity from the NUMA-node device and pins the engine container to a
# cpuset. The engine is vLLM's CPU build - the default
# vllm/vllm-openai image is CUDA-only. --block-size=32 is the smallest
# block its CPU attention backend accepts (multiples of 32); Modelplane
# reads the flag and chunks the endpoint picker's prefix cache the same
# way, so routing stays aligned. VLLM_CPU_KVCACHE_SPACE sets the KV
# cache's share of the node's RAM in GiB. No ModelCache: the engine pulls
# weights straight from Hugging Face.
apiVersion: modelplane.ai/v1alpha1
kind: ModelDeployment
metadata:
  name: qwen-cpu-demo
  namespace: ml-team
spec:
  replicas: 1
  template:
    spec:
      engines:
      - name: qwen
        members:
        - role: Standalone
          nodeSelector:
            devices:
            - name: cpu
              count: 1
              selectors:
              - cel: |
                  device.capacity["dra.cpu"].cpu.compareTo(quantity("4")) >= 0
          template:
            spec:
              containers:
              - name: engine
                image: vllm/vllm-openai-cpu:v0.32.0-x86_64
                args:
                - --model=Qwen/Qwen2.5-0.5B-Instruct
                - --served-model-name=$(MODELPLANE_SERVED_MODEL_NAME)
                - --max-model-len=4096
                - --block-size=32
                env:
                - name: VLLM_CPU_KVCACHE_SPACE
                  value: "4"
                # Sizes the pod's accounting and the DRA claim alike:
                # compose-model-replica stamps this as the claim's capacity
                # request, and the kubelet accounts CPUs only from requests
                # until KEP-5517. It must stay below the device's six
                # claimable cores - a whole-device claim exhausts the
                # shared CPU pool and the driver refuses to prepare it
                # while the node's DaemonSets need somewhere to run. Five
                # leaves them one claimable core.
                resources:
                  requests:
                    cpu: "5"
                  limits:
                    cpu: "5"
