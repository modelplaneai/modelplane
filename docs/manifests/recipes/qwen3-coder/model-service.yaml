# Exposes the multi-node BF16 qwen3-coder deployment as one model a caller can
# name. Name the model, ml-team/qwen3-coder, in a
# request to an InferenceGateway that serves it.
apiVersion: modelplane.ai/v1alpha1
kind: ModelService
metadata:
  name: qwen3-coder
  namespace: ml-team
spec:
  endpoints:
  - name: qwen3-coder
    selector:
      matchLabels:
        modelplane.ai/deployment: qwen3-coder
