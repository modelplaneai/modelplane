# Exposes the llama-3-1-8b deployment as one model a caller can name. Modelplane
# labels each composed ModelEndpoint with the deployment name, so this selector
# reaches every replica. Name the model,
# ml-team/llama-3-1-8b, in a request to an InferenceGateway that serves it.
apiVersion: modelplane.ai/v1alpha1
kind: ModelService
metadata:
  name: llama-3-1-8b
  namespace: ml-team
spec:
  endpoints:
  - name: llama-3-1-8b
    selector:
      matchLabels:
        modelplane.ai/deployment: llama-3-1-8b
