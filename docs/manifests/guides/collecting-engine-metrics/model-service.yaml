# Exposes the qwen2-5-0-5b deployment as one model a caller can name. Modelplane
# labels each composed ModelEndpoint with the deployment name, so this selector
# reaches every replica. Name the model,
# ml-team/qwen2-5-0-5b, in a request to an InferenceGateway that serves it.
apiVersion: modelplane.ai/v1alpha1
kind: ModelService
metadata:
  name: qwen2-5-0-5b
  namespace: ml-team
spec:
  endpoints:
  - name: qwen2-5-0-5b
    selector:
      matchLabels:
        modelplane.ai/deployment: qwen2-5-0-5b
