# Experimental native vLLM gRPC serving across two nodes. The leader hosts
# the Dynamo sidecar; the headless worker keeps its own native launch.
apiVersion: modelplane.ai/v1alpha1
kind: ModelDeployment
metadata:
  name: qwen2-5-14b
  namespace: ml-team
spec:
  replicas: 1
  template:
    spec:
      modelCacheRef:
        name: qwen2-5-14b
      engines:
      - name: qwen
        members:
        - role: Leader
          nodeSelector:
            devices:
            - name: gpu
              count: 1
              selectors:
              - cel: 'device.capacity["gpu.nvidia.com"].memory.compareTo(quantity("20Gi")) >= 0

                  '
          template:
            spec:
              containers:
              - name: engine
                image: vllm/vllm-openai:v0.32.0
                command:
                - /bin/sh
                - -c
                - pip install --index-url https://pypi.nvidia.com modelexpress && exec vllm serve Qwen/Qwen2.5-14B-Instruct
                  --served-model-name=$(MODELPLANE_SERVED_MODEL_NAME) --tensor-parallel-size=1 --pipeline-parallel-size=2
                  --distributed-executor-backend=mp --nnodes=2 --node-rank=$(MODELPLANE_RANK) --master-addr=$(MODELPLANE_LEADER_ADDRESS)
                  --load-format modelexpress --max-model-len=8192 --gpu-memory-utilization=0.90 --distributed-timeout-seconds=1800
                  --grpc-port=30001
                env:
                - name: VLLM_USE_RUST_FRONTEND
                  value: '1'
                - name: VLLM_ENGINE_READY_TIMEOUT_S
                  value: '1800'
                readinessProbe:
                  grpc:
                    port: 30001
                    service: ''
                  periodSeconds: 5
                  timeoutSeconds: 5
                startupProbe:
                  grpc:
                    port: 30001
                    service: ''
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 180
              initContainers:
              - name: runtime
                image: nvcr.io/nvidia/ai-dynamo/dynamo-sidecar-nightly:20261103-e37f0b9
                command:
                - dynamo-vllm-sidecar
                args:
                - --grpc-endpoint
                - 127.0.0.1:30001
                restartPolicy: Always
        - role: Worker
          worker:
            nodes: 1
          nodeSelector:
            devices:
            - name: gpu
              count: 1
              selectors:
              - cel: 'device.capacity["gpu.nvidia.com"].memory.compareTo(quantity("20Gi")) >= 0

                  '
          template:
            spec:
              containers:
              - name: engine
                image: vllm/vllm-openai:v0.32.0
                command:
                - /bin/sh
                - -c
                - pip install --index-url https://pypi.nvidia.com modelexpress && exec vllm serve Qwen/Qwen2.5-14B-Instruct
                  --served-model-name=$(MODELPLANE_SERVED_MODEL_NAME) --tensor-parallel-size=1 --pipeline-parallel-size=2
                  --distributed-executor-backend=mp --nnodes=2 --node-rank=$(MODELPLANE_RANK) --master-addr=$(MODELPLANE_LEADER_ADDRESS)
                  --headless --load-format modelexpress --max-model-len=8192 --gpu-memory-utilization=0.90 --distributed-timeout-seconds=1800
      serving:
        mode: Unified
        router: Dynamo
        dynamo:
          backendFramework: vllm
          runtimeVersionOverride: 1.7.0
          frontend:
            replicas: 2
            template:
              spec:
                containers:
                - name: main
                  image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend-nightly:20261103-e37f0b9
                  command:
                  - python3
                  - -m
                  - dynamo.frontend
                  args:
                  - --http-port
                  - '8000'
                  - --router-mode
                  - kv
