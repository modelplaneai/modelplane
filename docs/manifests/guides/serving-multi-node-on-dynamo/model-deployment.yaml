# Qwen2.5-14B served across two L4 nodes as a gang. The FP16 weights (~29 GB)
# don't fit one L4's 23 GB, so the engine is a Leader + Worker gang,
# pipeline-parallel across two g6.8xlarge nodes with one L4 each. Both pods mount
# the shared ModelCache.
#
# Modelplane composes a DGD with a runtime frontend and one multi-node component.
# The operator owns Grove topology and supplies the leader address and absolute
# rank for each engine copy. Member templates retain their launch commands.
apiVersion: modelplane.ai/v1alpha1
kind: ModelDeployment
metadata:
  name: qwen2-5-14b
  namespace: ml-team
spec:
  replicas: 1
  template:
    spec:
      modelCacheRef:
        name: qwen2-5-14b
      engines:
      - name: qwen
        members:
        - role: Leader
          nodeSelector:
            devices:
            - name: gpu
              count: 1
              selectors:
              - cel: |
                  device.capacity["gpu.nvidia.com"].memory.compareTo(quantity("20Gi")) >= 0
          template:
            spec:
              containers:
              - name: engine
                image: nvcr.io/nvidia/ai-dynamo/vllm-runtime-nightly:20261103-e37f0b9
                command:
                - /bin/sh
                - -c
                - >-
                  pip install --index-url https://pypi.nvidia.com modelexpress &&
                  exec python3 -m dynamo.vllm --model Qwen/Qwen2.5-14B-Instruct
                  --served-model-name=$(MODELPLANE_SERVED_MODEL_NAME)
                  --tensor-parallel-size=1
                  --pipeline-parallel-size=2
                  --distributed-executor-backend=mp
                  --nnodes=2 --node-rank=$(MODELPLANE_RANK)
                  --master-addr=$(MODELPLANE_LEADER_ADDRESS)
                  --load-format modelexpress
                  --max-model-len=8192
                  --gpu-memory-utilization=0.90
        - role: Worker
          worker:
            nodes: 1
          nodeSelector:
            devices:
            - name: gpu
              count: 1
              selectors:
              - cel: |
                  device.capacity["gpu.nvidia.com"].memory.compareTo(quantity("20Gi")) >= 0
          template:
            spec:
              containers:
              - name: engine
                image: nvcr.io/nvidia/ai-dynamo/vllm-runtime-nightly:20261103-e37f0b9
                command:
                - /bin/sh
                - -c
                - >-
                  pip install --index-url https://pypi.nvidia.com modelexpress &&
                  exec python3 -m dynamo.vllm --model Qwen/Qwen2.5-14B-Instruct
                  --served-model-name=$(MODELPLANE_SERVED_MODEL_NAME)
                  --tensor-parallel-size=1
                  --pipeline-parallel-size=2
                  --distributed-executor-backend=mp
                  --nnodes=2 --node-rank=$(MODELPLANE_RANK)
                  --master-addr=$(MODELPLANE_LEADER_ADDRESS)
                  --headless
                  --load-format modelexpress
                  --max-model-len=8192
                  --gpu-memory-utilization=0.90
