# An InferenceGateway is the front door for inference requests: the only address
# a caller sees. It speaks the OpenAI and Anthropic APIs, authenticates callers,
# and resolves the model a request names to a ModelService.
#
# It runs on an InferenceCluster, named by spec.clusterName. A gateway has to run
# somewhere, and Modelplane reuses InferenceCluster rather than a separate kind
# for it. That cluster can serve models too, or with no GPU pools host the
# gateway and nothing else.
#
# This one is the smallest useful shape: no hostname, no certificate and no
# caller keys, so it answers on its address over plain HTTP and authenticates
# nobody. Fine for getting started, not for an untrusted network.
apiVersion: modelplane.ai/v1alpha1
kind: InferenceGateway
metadata:
  name: local
spec:
  clusterName: nebius-eu-north
