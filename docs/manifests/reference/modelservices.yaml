apiVersion: modelplane.ai/v1alpha1
kind: ModelService
metadata:
  name: qwen-72b
  namespace: ml-team
  labels:
    # Matched by an InferenceGateway's serviceSelector. Your label, under your
    # own prefix.
    example.org/region: eu
spec:
  endpoints:
    # Entries at the same priority share traffic by weight, so this pair is a
    # 90/10 canary across two deployments. name is a stable handle, unique
    # within the service.
    - name: stable
      priority: 0
      weight: 90
      selector:
        matchLabels:
          modelplane.ai/deployment: qwen-72b
    - name: canary
      priority: 0
      weight: 10
      selector:
        matchLabels:
          modelplane.ai/deployment: qwen-72b-next
    # Priority 1 takes traffic as priority 0 loses healthy endpoints, which
    # makes this provider a failover for the deployments above.
    - name: together
      priority: 1
      selector:
        matchLabels:
          modelplane.ai/endpoint: together-qwen-72b
