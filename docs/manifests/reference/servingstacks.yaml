apiVersion: infrastructure.modelplane.ai/v1alpha1
kind: ServingStack
metadata:
  name: west-gke-stack
  namespace: platform
spec:
  cloud: GKE
  secrets:
    - type: Kubeconfig
      name: west-gke-kubeconfig
      key: kubeconfig
    - type: GoogleApplicationCredentials
      name: west-gke-sa-key
      key: private_key
  # Projected from the InferenceCluster: the name InferenceGateways reach this
  # cluster's gateway by, and the CAs whose client certificates it accepts.
  gateway:
    hostname: gateway-west-gke-1a2b3.modelplane-system.svc.cluster.local
    clientCAs:
      - name: eu
        certificate: |
          -----BEGIN CERTIFICATE-----
          MIIBszCCAVmgAwIBAgIQ…
          -----END CERTIFICATE-----
