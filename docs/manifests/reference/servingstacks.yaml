apiVersion: infrastructure.modelplane.ai/v1alpha1
kind: ServingStack
metadata:
  name: west-gke-stack
  namespace: platform
spec:
  secrets:
    - type: Kubeconfig
      name: west-gke-kubeconfig
      key: kubeconfig
    - type: GoogleApplicationCredentials
      name: west-gke-sa-key
      key: private_key
  versions:
    certManager: "v1.21.1"
    envoyGateway: "v1.8.4"
  gateway:
    listeners:
      - name: http
        port: 80
        protocol: HTTP
