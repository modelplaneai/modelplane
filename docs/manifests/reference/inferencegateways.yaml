apiVersion: modelplane.ai/v1alpha1
kind: InferenceGateway
metadata:
  name: eu
spec:
  # The InferenceCluster this gateway runs on, which decides its region and its
  # address. The cluster needs no GPU pools.
  clusterName: gw-gcp-eu
  # Certificates for the DNS names callers use. The names are yours: point your
  # DNS at status.address.
  tls:
    certificateRefs:
      - name: eu-example-com-tls
  auth:
    # How the gateway authenticates callers.
    method: APIKey
    apiKey:
      # Each key in a selected Secret is one caller: the entry's name is the
      # caller's identity, its value is the key.
      secretSelector:
        matchLabels:
          modelplane.ai/inference-keys: "true"
  # The ModelServices this gateway serves. Absent, it serves every one. Scoped
  # here to a region, which is how residency is expressed.
  serviceSelector:
    matchLabels:
      example.org/region: eu
  # How the gateway's proxy pods shut down and roll out. Absent, a stopping pod
  # drains 300s and the Deployment rolls out on Envoy Gateway's own defaults.
  # Match drainTimeout to the longest request the served ModelServices allow.
  proxy:
    drainTimeout: 45m
    # Bring a new proxy up before an old one drains.
    maxSurge: 1
    maxUnavailable: 0
