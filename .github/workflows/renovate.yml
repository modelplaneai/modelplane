name: Renovate
on:
  # Allows manual/automated trigger for debugging purposes
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate's log level"
        required: true
        default: "info"
        type: string
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

env:
  LOG_LEVEL: "info"
  RENOVATE_VERSION: "44.222.0"

jobs:
  renovate:
    runs-on: ubuntu-24.04
    if: |
      !github.event.repository.fork &&
      !github.event.pull_request.head.repo.fork
    steps:
      # The postUpgradeTask builds the whole project, which needs more disk
      # than the runner has free by default, so reclaim space we don't use.
      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@3f13feab2962a87273d379ebc36ea159527e6cc9 # v1.3.2
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: true
          swap-storage: false
          large-packages: false
          docker-images: false

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Don't waste time starting Renovate if JSON is invalid
      - name: Validate Renovate JSON
        run: npx --yes --package renovate@${RENOVATE_VERSION} -- renovate-config-validator

      - name: Get token
        id: get-github-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RENOVATE_GITHUB_APP_ID }}
          private-key: ${{ secrets.RENOVATE_GITHUB_APP_PRIVATE_KEY }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Use GitHub API to create commits
          RENOVATE_PLATFORM_COMMIT: "true"
          LOG_LEVEL: ${{ github.event.inputs.logLevel || env.LOG_LEVEL }}
          RENOVATE_ALLOWED_COMMANDS: '["^modelplane-nix .+"]'
          # The postUpgradeTask builds the whole project from an empty Nix
          # store, which can outlast Renovate's default 15 minute limit on the
          # commands it runs.
          RENOVATE_EXECUTION_TIMEOUT: "60"
        with:
          # Pin the Renovate that runs, not just the validator above. Without
          # this the action falls back to its floating major tag.
          renovate-version: ${{ env.RENOVATE_VERSION }}
          configurationFile: .github/renovate.json5
          token: '${{ steps.get-github-app-token.outputs.token }}'
          mount-docker-socket: true
          docker-user: root
          docker-cmd-file: .github/renovate-entrypoint.sh
