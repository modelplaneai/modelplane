name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Version tag to push the package with, e.g. v0.1.0. Leave empty to
          push a dev version derived from git metadata. To cut a release, run
          this workflow against the release tag (e.g. v0.1.0) with this set to
          the same value.
        type: string
        required: false
        default: ""

# Cancel in-progress runs for the same PR. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: log-lines = 500

      # Cache Nix store paths in the GitHub Actions cache so builds reuse work
      # across runs. use-flakehub is off so artifacts stay in the Actions cache
      # rather than going to a third party, which matters for a private repo.
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false

      - name: Check
        run: nix flake check --print-build-logs

  # Pushes the package on every push to main and on any manual run. Both push a
  # dev version derived from git metadata unless the run supplies a tag input,
  # which is how releases are cut - see RELEASING.md.
  push-package:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    needs: [check]
    runs-on: ubuntu-24.04

    # Secrets aren't available in if expressions, so expose the (non-secret)
    # robot ID as an env var that the push steps can gate on. Forks don't have
    # the secret, so their runs build the package but skip pushing it.
    env:
      UP_ROBOT_ID: ${{ secrets.UP_ROBOT_ID }}

    steps:
      # Building and pushing the package needs more disk than the runner has
      # free by default, so reclaim space we don't use.
      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@3f13feab2962a87273d379ebc36ea159527e6cc9 # v1.3.2
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: true
          swap-storage: false
          large-packages: false
          docker-images: false

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: log-lines = 500

      # See the check job for why use-flakehub is off.
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false

      - name: Build
        run: nix run .#build --print-build-logs

      # The Crossplane CLI uses Docker's credential store for OCI pushes.
      - name: Login to registry
        if: env.UP_ROBOT_ID != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: xpkg.upbound.io
          username: ${{ env.UP_ROBOT_ID }}
          password: ${{ secrets.UP_ROBOT_TOKEN }}

      # On a release run, fetch the GitHub release's notes so the push app
      # embeds them in the package's Marketplace extensions. Ordinary runs
      # skip this; the push app only appends the notes when the file exists.
      - name: Generate release notes
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "${TAG}" --json body -q .body > release_notes.md || true
          [ -s release_notes.md ] || rm -f release_notes.md

      # With a tag input (a release) push that exact version; otherwise push a
      # dev version the push app derives from git metadata.
      - name: Push
        if: env.UP_ROBOT_ID != ''
        run: |
          if [ -n "${TAG}" ]; then
            nix run .#push --print-build-logs -- --tag "${TAG}"
          else
            nix run .#push --print-build-logs
          fi
        env:
          TAG: ${{ inputs.tag }}
