[project]
name = "modelplane"
version = "0.0.0"
description = "An open-source AI inference platform built on Crossplane."
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"

[tool.uv]
# This is a workspace root; it's not installable itself.
package = false

[tool.uv.workspace]
members = ["functions/*", "schemas/python"]

[dependency-groups]
dev = [
  "crossplane-function-sdk-python>=0.14.0",
  # Type stubs for the dynamically generated protobuf modules, so ty can
  # resolve the Struct and Duration types the functions and tests use.
  "types-protobuf>=4.24",
  # Imported by the docs manifest validator (docs/utils/validate).
  #
  # pydantic can't be declared where it belongs, on crossplane-models, whose
  # generated modules all import it: the Crossplane CLI writes that package's
  # pyproject.toml, and nix run .#build deletes and recreates the whole
  # schemas/ tree, so an edit there survives until the next build.
  "pyyaml>=6.0",
  "pydantic>=2.0",
  # 9.0 reports unittest subtests natively.
  "pytest>=9.0",
  # The end-to-end tests read the clusters through the Kubernetes API.
  "kubernetes>=36.0",
]

[tool.ruff]
target-version = "py312"
# Match ruff format's default. The formatter won't produce lines longer than
# this, but string literals in deeply nested dicts can still exceed it.
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python idioms)
    "A",      # flake8-builtins (shadowing builtins)
    "B",      # flake8-bugbear (common gotchas)
    "PL",     # pylint subset
    "SIM",    # flake8-simplify (simplifiable constructs)
    "RET",    # flake8-return (return statement issues)
    "ARG",    # flake8-unused-arguments
    "C4",     # flake8-comprehensions (idiomatic comprehensions)
    "PTH",    # flake8-use-pathlib (pathlib over os.path)
    "T20",    # flake8-print (no print() in library code)
    "FBT",    # flake8-boolean-trap (no boolean positional args)
    "TID",    # flake8-tidy-imports (no relative imports)
    "BLE",    # flake8-blind-except (no bare except Exception)
    "ANN",    # flake8-annotations (require type annotations)
    "PT",     # flake8-pytest-style (pytest idioms, no unittest assertions)
    "RUF",    # ruff-specific rules (incl. unused/malformed noqa)
]
# The function unit test checker (hack/check_function_tests.py) and the list
# selector checker (hack/check_list_selectors.py) take their escapes as noqa
# codes, which ruff would otherwise reject as unknown.
external = ["MPT", "MPF"]

[tool.ruff.lint.pylint]
# Builder functions like helm_release use named parameters for clarity.
max-args = 8

[tool.ruff.lint.flake8-annotations]
# Variadic **kwargs spread into a Pydantic model constructor are inherently
# dynamic; allow Any for *args/**kwargs while still flagging it elsewhere.
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
# Generated models are not under our control.
"schemas/python/**" = ["ALL"]
# Function tests use magic values, many parameters, long hardcoded resource
# dicts, and boolean fixture toggles passed positionally.
"functions/*/tests/**" = ["E501", "PLR2004", "PLR0913", "FBT001"]
# The end-to-end tests compare HTTP statuses and curl exit codes.
"e2e/**" = ["PLR2004"]
# The pytest style rules are for tests. Elsewhere an assert guards an invariant.
"!{**/tests/**,e2e/**}" = ["PT"]
# fn.py uses gRPC's required PascalCase method name.
"functions/*/function/fn.py" = ["N802"]
# The docs manifest validator is a CLI script; print is its output.
"docs/utils/validate/**" = ["T201"]
# The checkers are CLI scripts; print is their output.
"hack/check_function_tests.py" = ["T201"]
"hack/check_list_selectors.py" = ["T201"]
"hack/check_supported_drivers.py" = ["T201"]
# Generated serving stack lists carry upstream chart values verbatim; long
# string literals and unicode arrive from the recipes.
"functions/*/function/stacks/clouds/generated/**" = ["E501", "RUF001", "RUF002", "RUF003"]
# main.py is the click CLI entrypoint: boolean flags are idiomatic, and it
# catches Exception at the top level to report startup failures cleanly.
"functions/*/function/main.py" = ["FBT001", "BLE001"]
# The serving stack generator is a CLI script: its classification report
# prints to stderr, and its recipe transform is legitimately branchy.
"functions/compose-serving-stack/generate.py" = ["T201", "PLR0912", "PLR0915"]

[tool.ty.environment]
# The functions target Python 3.12 (see tool.ruff target-version).
python-version = "3.12"

[tool.ty.src]
# The generated Pydantic models aren't under our control and aren't checked.
exclude = ["schemas/python"]

[tool.pytest]
# Fail on unknown config, unregistered markers, duplicate parametrize IDs and
# passing xfails.
strict = true
# Tests compare whole responses, and by default pytest cuts the diff between two
# large values down to a summary line.
verbosity_assertions = "2"
# List each test by name as it runs.
addopts = ["-v"]
