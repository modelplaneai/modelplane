# Lints the review agent's output as it writes it. The ai-tells rules catch
# the phrasing that marks text as agent-written. Four Google rules apply to
# review comments too. The rest of the Google style stays off, since it bans
# the first person that review comments use.
StylesPath = styles
MinAlertLevel = error
Packages = Google, https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.md]
BasedOnStyles = ai-tells

# "Implementation" is the precise word in an engineering review, and the
# plainer alternatives this rule suggests are worse.
ai-tells.FormalRegister = NO

Google.Anthropomorphism = error
Google.ExcessiveClaims = error
Google.Passive = error
Google.Semicolons = error
